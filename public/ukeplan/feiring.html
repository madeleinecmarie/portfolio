<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dagen er i boks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: intro and theme switch, the course-completed dialog, then one stage per empty tab in a wrapping grid */
:root {
  --bg: #f4f1f3;
  --surface: #fdfcfd;
  --line: #e7e1e5;
  --fg: #2c2a2b;
  --muted: #6e686b;
  --ink: #2c2a2b;
  --wall: #ece6ea;
  --font: "Poppins", "Segoe UI", system-ui, sans-serif;

  /* Theme colors, named like Seebrite's --sbi-colors-app-primary-* */
  --primary: #c6569e;
  --primary-darker: #954176;
  --primary-dimmed: #f6b8dd;
  --tile: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171415;
    --surface: #221e20;
    --line: #3a3437;
    --fg: #f2eef0;
    --muted: #a9a1a5;
    --wall: #2b2628;
    --tile: #f6f2f4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171415;
  --surface: #221e20;
  --line: #3a3437;
  --fg: #f2eef0;
  --muted: #a9a1a5;
  --wall: #2b2628;
  --tile: #f6f2f4;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 22px;
}

h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 500;
  text-wrap: balance;
}

.intro {
  margin: 6px 0 0;
  max-width: 64ch;
  color: var(--muted);
}

h2.section {
  margin: 10px 0 0;
  font-size: 18px;
  font-weight: 500;
}

.themes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.themes > span {
  color: var(--muted);
  font-size: 13px;
  margin-right: 4px;
}

.theme-btn {
  font: inherit;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
}

.theme-btn i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--swatch);
}

.theme-btn[aria-pressed="true"] {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.theme-btn:focus-visible,
.replay:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

@media (max-width: 960px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 620px) {
  .grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

.card {
  background: var(--surface);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 1px 2px rgba(60, 20, 40, 0.05), 0 4px 12px -6px rgba(60, 20, 40, 0.1);
  min-width: 0;
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.card h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 500;
}

.tab-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--primary-darker);
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  border-radius: 999px;
  padding: 2px 10px;
  white-space: nowrap;
}

.card p.about {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.stage {
  position: relative;
  background: var(--bg);
  border-radius: 10px;
  padding: 18px 12px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 4px;
  overflow: hidden;
}

.stage svg,
.dialog svg {
  width: 100%;
  max-width: 240px;
  height: auto;
  display: block;
  overflow: visible;
}

.stage strong {
  font-size: 16px;
  font-weight: 600;
  margin-top: 6px;
}

.stage small {
  font-size: 13px;
  color: var(--muted);
  max-width: 30ch;
}

.fake-btn {
  margin-top: 8px;
  font-size: 13px;
  background: var(--primary);
  color: #fff;
  border-radius: 4px;
  padding: 7px 14px;
}

.replay {
  align-self: flex-start;
  font: inherit;
  font-size: 13px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg);
  border-radius: 4px;
  padding: 5px 12px;
  cursor: pointer;
}

/* Course completed dialog over a dimmed course list */
.done-card {
  max-width: 760px;
}

.app-mock {
  position: relative;
  background: var(--bg);
  border-radius: 10px;
  min-height: 430px;
  overflow: hidden;
  padding: 16px;
}

.mock-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.mock-list div {
  height: 150px;
  border-radius: 10px;
  background: var(--surface);
}

.scrim {
  position: absolute;
  inset: 0;
  background: rgba(30, 24, 27, 0.42);
  display: grid;
  place-items: center;
  padding: 16px;
}

.dialog {
  position: relative;
  z-index: 1;
  width: min(340px, 100%);
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 20px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
  animation: pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
}

.dialog strong {
  font-size: 21px;
  font-weight: 600;
}

.dialog small {
  font-size: 14px;
  color: var(--muted);
}

.dialog .fake-btn {
  padding: 8px 24px;
}

.confetti-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}

@keyframes pop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* The mascot: a book with a face, arms, legs and a graduation cap */
svg * { transform-box: fill-box; }
.m-book { fill: var(--body, var(--primary)); }
.m-spine { fill: var(--primary-darker); }
.m-pages { fill: var(--tile); }
.m-limb { fill: none; stroke: var(--primary-darker); stroke-width: 5.5; stroke-linecap: round; }
.m-shoe { fill: var(--primary-darker); }
.m-ink { fill: var(--face-ink, var(--ink)); }
.m-line { fill: none; stroke: var(--face-ink, var(--ink)); stroke-width: 2.2; stroke-linecap: round; }
.m-shine { fill: var(--face-shine, #ffffff); }
.m-blush { fill: var(--primary-dimmed); opacity: 0.95; }
.m-cap { fill: var(--primary-darker); }
.m-tassel { fill: none; stroke: var(--primary-dimmed); stroke-width: 2; stroke-linecap: round; }
.m-knot { fill: var(--primary-dimmed); }
.floor { fill: var(--primary-dimmed); opacity: 0.55; }
.spark { fill: var(--primary); }

.m-eyes-open { transform-origin: 50% 50%; animation: blink 4.2s ease-in-out infinite; }
@keyframes blink {
  0%, 90%, 100% { transform: scaleY(1); }
  93% { transform: scaleY(0.1); }
  96% { transform: scaleY(1); }
}
.m-tassel-swing { transform-origin: 0% 0%; animation: tassel 2.4s ease-in-out infinite; }
@keyframes tassel {
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(10deg); }
}

.wonder { font: 700 22px var(--font); fill: var(--primary); animation: wonder 4s ease-in-out infinite; transform-origin: center; }
@keyframes wonder {
  0%, 30% { opacity: 0; transform: translateY(6px) scale(0.6); }
  45%, 70% { opacity: 1; transform: translateY(0) scale(1); }
  85%, 100% { opacity: 0; transform: translateY(-8px) scale(0.8); }
}

/* Course completed: the cap is tossed, spins and lands again */
.toss .m-cap-group { transform-origin: 50% 50%; animation: toss 2.6s cubic-bezier(0.3, 0, 0.4, 1) 0.4s both; }
@keyframes toss {
  0% { transform: translate(0, 0) rotate(0deg); }
  45% { transform: translate(-6px, -78px) rotate(-300deg); }
  80% { transform: translate(0, 0) rotate(-720deg); }
  88% { transform: translate(0, 3px) rotate(-720deg); }
  100% { transform: translate(0, 0) rotate(-720deg); }
}
.cheer { transform-origin: 50% 100%; animation: cheer 2.6s ease-in-out 0.4s both; }
@keyframes cheer {
  0% { transform: translateY(0) scale(1, 1); }
  8% { transform: translateY(0) scale(1.08, 0.9); }
  18% { transform: translateY(-14px) scale(0.96, 1.05); }
  30% { transform: translateY(0) scale(1, 1); }
  80% { transform: translateY(0) scale(1, 1); }
  86% { transform: translateY(0) scale(1.06, 0.92); }
  94% { transform: translateY(-6px) scale(0.98, 1.03); }
  100% { transform: translateY(0) scale(1, 1); }
}

.confetti > rect {
  opacity: 0;
  transform-origin: center;
  animation: fall var(--dur, 2.4s) cubic-bezier(0.25, 0.6, 0.45, 1) var(--delay, 0s) both;
}
@keyframes fall {
  0% { opacity: 0; transform: translate(0, -10px) rotate(0deg); }
  8% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx, 0px), 440px) rotate(var(--rot, 360deg)); }
}

.sparkles path {
  transform-origin: center;
  opacity: 0;
  animation: twinkle var(--dur, 2.6s) ease-in-out var(--delay, 0s) infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
  50% { opacity: 1; transform: scale(1) rotate(45deg); }
}


.hat-select { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); max-width: 100%; }
.hat-select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.propeller { transform-origin: 50% 50%; animation: propeller 0.5s linear infinite; }
@keyframes propeller { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
.bulb { animation: bulb 3s ease-in-out infinite; }
@keyframes bulb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.hat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 960px) { .hat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hat-card { background: var(--surface); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(60, 20, 40, 0.05); min-width: 0; }
.hat-card h3 { margin: 0; font-size: 14px; font-weight: 500; }
.hat-card .stage { padding: 10px 6px 8px; }
.hat-wiggle { transform-origin: 50% 100%; animation: hat-wiggle 2.6s ease-in-out infinite; }
@keyframes hat-wiggle { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
.signal { opacity: 0; animation: signal 1.6s ease-out infinite; }
@keyframes signal { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
/* Shared idle motions for the module pages */
.bob { transform-origin: 50% 100%; animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.sway { transform-origin: 50% 100%; animation: sway 4.2s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
.hop { transform-origin: 50% 100%; animation: hop 4s ease-in-out infinite; }
@keyframes hop {
  0%, 50%, 72%, 100% { transform: translateY(0) scale(1, 1); }
  56% { transform: translateY(0) scale(1.06, 0.93); }
  62% { transform: translateY(-12px) scale(0.98, 1.03); }
  68% { transform: translateY(0) scale(1.03, 0.97); }
}
.look { animation: look 5s ease-in-out infinite; }
@keyframes look {
  0%, 18%, 100% { transform: translateX(0); }
  25%, 45% { transform: translateX(-3.5px); }
  55%, 78% { transform: translateX(3.5px); }
}
.mock-list.rows { grid-template-columns: minmax(0, 1fr); }
.mock-list.rows div { height: 58px; }
.clip-board { fill: var(--primary-darker); }
.clip-paper { fill: var(--tile); }
.clip-box { fill: none; stroke: var(--primary-dimmed); stroke-width: 1.6; }
.clip-row { fill: var(--primary-dimmed); }
.tick { fill: none; stroke: var(--primary); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14; animation: tick 4s ease-out infinite; }
@keyframes tick {
  0%, 10% { stroke-dashoffset: 14; opacity: 1; }
  22%, 82% { stroke-dashoffset: 0; opacity: 1; }
  92% { stroke-dashoffset: 0; opacity: 0; }
  100% { stroke-dashoffset: 14; opacity: 0; }
}


/* New courses: reading happily, the little book turns its pages */
.read { animation: read 2.8s ease-in-out infinite; }
@keyframes read {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.mini-page { fill: var(--tile); stroke: var(--primary-dimmed); stroke-width: 1.2; }
.mini-flip { transform-origin: 0% 50%; animation: miniflip 1.8s ease-in-out infinite; }
@keyframes miniflip {
  0%, 20% { transform: scaleX(1); }
  80%, 100% { transform: scaleX(-1); }
}
.note { fill: var(--primary); animation: note 2.8s ease-out infinite; opacity: 0; }
@keyframes note {
  0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translate(14px, -30px) scale(1); }
}

/* Started courses: dozing until a course is started */
.doze { transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { transform: rotate(-6deg) scale(1, 1); }
  50% { transform: rotate(-6deg) scale(1.02, 1.035); }
}
.zz { font: 700 16px var(--font); fill: var(--primary); opacity: 0; animation: zz 3.6s ease-out infinite; }
@keyframes zz {
  0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(22px, -36px) scale(1.15); }
}

/* Overdue courses: jumping with a checked sign */
.jump { transform-origin: 50% 100%; animation: jump 1.5s cubic-bezier(0.4, 0, 0.5, 1) infinite; }
@keyframes jump {
  0%, 100% { transform: translateY(0) scale(1.08, 0.9); }
  15% { transform: translateY(0) scale(1, 1); }
  45% { transform: translateY(-24px) scale(0.96, 1.05); }
  75% { transform: translateY(0) scale(1, 1); }
  88% { transform: translateY(0) scale(1.06, 0.92); }
}
.jump-floor { transform-origin: center; animation: floor 1.5s cubic-bezier(0.4, 0, 0.5, 1) infinite; }
@keyframes floor {
  0%, 15%, 75%, 100% { transform: scaleX(1); opacity: 0.55; }
  45% { transform: scaleX(0.65); opacity: 0.3; }
}
.sign { fill: var(--tile); stroke: var(--primary-dimmed); stroke-width: 2; }
.sign-check { fill: none; stroke: var(--primary); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }

/* Completed courses: looking up at the empty frame and reaching for it */
.frame { transform-origin: 50% 0%; animation: swing 4s ease-in-out infinite; }
@keyframes swing {
  0%, 100% { transform: rotate(-2.5deg); }
  50% { transform: rotate(2.5deg); }
}
.frame-border { fill: var(--wall); stroke: var(--primary-darker); stroke-width: 5; }
.frame-slot { fill: none; stroke: var(--primary); stroke-width: 1.8; stroke-dasharray: 5 4; animation: march 1.4s linear infinite; }
@keyframes march { to { stroke-dashoffset: -18; } }
.string { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.nail { fill: var(--muted); }
.reach { transform-origin: 50% 100%; animation: reach 3.4s ease-in-out infinite; }
@keyframes reach {
  0%, 40%, 100% { transform: translateY(0) scale(1, 1); }
  48% { transform: translateY(0) scale(1.06, 0.93); }
  60% { transform: translateY(-16px) scale(0.97, 1.04); }
  72% { transform: translateY(0) scale(1.04, 0.95); }
  78% { transform: translateY(0) scale(1, 1); }
}

/* Course completed: the cap is tossed, spins and lands again */
.toss .m-cap-group { transform-origin: 50% 50%; animation: toss 2.6s cubic-bezier(0.3, 0, 0.4, 1) 0.4s both; }
@keyframes toss {
  0% { transform: translate(0, 0) rotate(0deg); }
  45% { transform: translate(-6px, -78px) rotate(-300deg); }
  80% { transform: translate(0, 0) rotate(-720deg); }
  88% { transform: translate(0, 3px) rotate(-720deg); }
  100% { transform: translate(0, 0) rotate(-720deg); }
}
.cheer { transform-origin: 50% 100%; animation: cheer 2.6s ease-in-out 0.4s both; }
@keyframes cheer {
  0% { transform: translateY(0) scale(1, 1); }
  8% { transform: translateY(0) scale(1.08, 0.9); }
  18% { transform: translateY(-14px) scale(0.96, 1.05); }
  30% { transform: translateY(0) scale(1, 1); }
  80% { transform: translateY(0) scale(1, 1); }
  86% { transform: translateY(0) scale(1.06, 0.92); }
  94% { transform: translateY(-6px) scale(0.98, 1.03); }
  100% { transform: translateY(0) scale(1, 1); }
}

.confetti > rect {
  opacity: 0;
  transform-origin: center;
  animation: fall var(--dur, 2.4s) cubic-bezier(0.25, 0.6, 0.45, 1) var(--delay, 0s) both;
}
@keyframes fall {
  0% { opacity: 0; transform: translate(0, -10px) rotate(0deg); }
  8% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx, 0px), 440px) rotate(var(--rot, 360deg)); }
}

.sparkles path {
  transform-origin: center;
  opacity: 0;
  animation: twinkle var(--dur, 2.6s) ease-in-out var(--delay, 0s) infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
  50% { opacity: 1; transform: scale(1) rotate(45deg); }
}

/* All courses, variant: magnifying glass that makes one eye big */
.peer { transform-origin: 50% 100%; animation: peer 4.4s ease-in-out infinite; }
@keyframes peer {
  0%, 100% { transform: rotate(-4deg) translateX(-2px); }
  30% { transform: rotate(3deg) translateX(3px); }
  60% { transform: rotate(-2deg) translateX(0); }
}
.loupe { transform-origin: 30% 80%; animation: loupe 4.4s ease-in-out infinite; }
@keyframes loupe {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  30% { transform: translate(4px, -3px) rotate(6deg); }
  60% { transform: translate(-2px, 2px) rotate(-4deg); }
}
.loupe-glass { fill: var(--tile); fill-opacity: 0.55; stroke: var(--primary-darker); stroke-width: 4; }
.loupe-handle { fill: none; stroke: var(--primary-darker); stroke-width: 6; stroke-linecap: round; }
.big-eye { transform-origin: 50% 50%; animation: big-blink 4.4s ease-in-out infinite; }
@keyframes big-blink {
  0%, 84%, 100% { transform: scaleY(1); }
  88% { transform: scaleY(0.1); }
  92% { transform: scaleY(1); }
}

/* All courses, variant: checking the mailbox, the flag goes up and a letter peeks out */
.mail-flag { transform-origin: 0% 100%; animation: flag 4.5s ease-in-out infinite; }
.mail-letter { animation: letter 4.5s ease-in-out infinite; }
.mail-hop { transform-origin: 50% 100%; animation: mail-hop 4.5s ease-in-out infinite; }
@keyframes flag {
  0%, 30% { transform: rotate(90deg); }
  42%, 80% { transform: rotate(0deg); }
  46% { transform: rotate(-12deg); }
  52% { transform: rotate(6deg); }
  92%, 100% { transform: rotate(90deg); }
}
@keyframes letter {
  0%, 40% { transform: translateX(10px); opacity: 0; }
  52%, 76% { transform: translateX(-8px); opacity: 1; }
  88%, 100% { transform: translateX(10px); opacity: 0; }
}
@keyframes mail-hop {
  0%, 48%, 70%, 100% { transform: translateY(0) scale(1, 1); }
  54% { transform: translateY(0) scale(1.06, 0.93); }
  60% { transform: translateY(-10px) scale(0.98, 1.03); }
  66% { transform: translateY(0) scale(1.03, 0.97); }
}


/* Week completed: the day chips fill one by one, then the mascot cheers */
#stage-week .app-mock, #stage-week { min-height: 480px; }
.week-strip { display: flex; gap: 8px; margin: 8px 0 2px; }
.week-strip span {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 600;
  color: var(--primary-darker); background: var(--bg);
  border: 2px solid var(--primary-dimmed);
  animation: day-done 0.45s ease-out calc(0.3s + var(--i) * 0.22s) both;
}
@keyframes day-done {
  0% { background: var(--bg); color: var(--primary-darker); border-color: var(--primary-dimmed); transform: scale(1); }
  60% { transform: scale(1.22); }
  100% { background: var(--primary); color: #fff; border-color: var(--primary); transform: scale(1); }
}
#stage-week .cheer { animation-delay: 1.95s; }
/* Day completed: earlier days are already done, today pops in with a ring, later days stay empty */
.week-strip .day-before { animation: none; background: var(--primary); color: #fff; border-color: var(--primary); }
.week-strip .day-later { animation: none; }
.week-strip .day-today { animation-delay: 0.4s; box-shadow: 0 0 0 0 var(--primary-dimmed); animation: day-done 0.45s ease-out 0.4s both, today-ring 1.2s ease-out 0.85s 2; }
@keyframes today-ring { 0% { box-shadow: 0 0 0 0 var(--primary-dimmed); } 100% { box-shadow: 0 0 0 10px transparent; } }
#stage-daybox .day-cheer { animation-delay: 0.85s; animation-duration: 2.2s; }
/* The weekend sits in brackets with a dashed edge, since it is optional */
.week-strip { align-items: center; }
.week-strip .week-paren { font-weight: 300; font-size: 26px; line-height: 1; color: var(--primary-dimmed); margin: 0 -4px; }
.week-strip .week-weekend { border-style: dashed; }

/* Empty week: sipping coffee, steam rising */
.sip { transform-origin: 0% 100%; animation: sip 5s ease-in-out infinite; }
@keyframes sip {
  0%, 38%, 62%, 100% { transform: translate(0, 0) rotate(0deg); }
  46%, 54% { transform: translate(-3px, -5px) rotate(-14deg); }
}
.steam { fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; opacity: 0; animation: steam 2.4s ease-out infinite; }
@keyframes steam {
  0% { opacity: 0; transform: translateY(2px); }
  30% { opacity: 0.6; }
  100% { opacity: 0; transform: translateY(-10px); }
}

/* Nothing today: the calendar page flips to the next day */
.cal-num { font: 700 24px var(--font); fill: var(--ink); text-anchor: middle; }
.cal-page { transform-origin: 50% 0%; animation: cal-flip 4s ease-in-out infinite; }
@keyframes cal-flip {
  0%, 45% { transform: scaleY(1); opacity: 1; }
  60% { transform: scaleY(0); opacity: 0.5; }
  61%, 90% { transform: scaleY(0); opacity: 0; }
  100% { transform: scaleY(1); opacity: 1; }
}


/* Submitted: the camera flashes, the photo slides out and gets a check */
.flash-burst { fill: var(--primary-dimmed); transform-origin: center; opacity: 0; animation: burst 0.7s ease-out 0.4s both; }
@keyframes burst {
  0% { opacity: 0; transform: scale(0.2) rotate(0deg); }
  40% { opacity: 1; transform: scale(1.4) rotate(30deg); }
  100% { opacity: 0; transform: scale(1.8) rotate(45deg); }
}
.photo-out { transform-origin: 50% 50%; animation: photo-out 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.7s both; }
@keyframes photo-out {
  from { opacity: 0; transform: translate(-48px, 44px) scale(0.2) rotate(-20deg); }
  to { opacity: 1; transform: translate(0, 0) scale(1) rotate(6deg); }
}
.badge { transform-origin: 50% 50%; animation: badge 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.4) 1.5s both; }
@keyframes badge {
  from { opacity: 0; transform: scale(0); }
  to { opacity: 1; transform: scale(1); }
}
#stage-sent .cheer { animation-delay: 1.6s; }

/* All delivered: the last product goes up on the shelf */
.stock { animation: stock 4.5s ease-in-out infinite; }
@keyframes stock {
  0%, 12% { transform: translate(-52px, 33px); opacity: 1; }
  30% { transform: translate(-28px, -10px); }
  45%, 84% { transform: translate(0, 0); opacity: 1; }
  92% { transform: translate(0, 0); opacity: 0; }
  93% { transform: translate(-52px, 33px); opacity: 0; }
  100% { transform: translate(-52px, 33px); opacity: 1; }
}
.shelf-hop { transform-origin: 50% 100%; animation: shelf-hop 4.5s ease-in-out infinite; }
@keyframes shelf-hop {
  0%, 46%, 66%, 100% { transform: translateY(0) scale(1, 1); }
  51% { transform: translateY(0) scale(1.06, 0.93); }
  57% { transform: translateY(-12px) scale(0.98, 1.03); }
  62% { transform: translateY(0) scale(1.03, 0.97); }
}

/* Waiting for approval: the hourglass runs and turns */
.hourglass { transform-origin: 50% 50%; animation: turn 5s ease-in-out infinite; }
@keyframes turn {
  0%, 78% { transform: rotate(0deg); }
  95%, 100% { transform: rotate(180deg); }
}
.sand-top { transform-origin: 50% 100%; animation: sand-top 5s linear infinite; }
@keyframes sand-top { 0% { transform: scaleY(1); } 75%, 100% { transform: scaleY(0); } }
.sand-bottom { transform-origin: 50% 100%; animation: sand-bottom 5s linear infinite; }
@keyframes sand-bottom { 0% { transform: scaleY(0); } 75%, 100% { transform: scaleY(1); } }
.sand-stream { animation: stream 5s linear infinite; }
@keyframes stream { 0%, 72% { opacity: 1; } 76%, 100% { opacity: 0; } }


/* Published: the paper plane flies off, the mascot cheers */
.plane { transform-origin: 0% 50%; animation: plane 2.4s ease-in-out 0.5s both; }
@keyframes plane {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  35% { transform: translate(40px, -36px) rotate(-18deg); }
  65% { transform: translate(78px, -24px) rotate(10deg); opacity: 1; }
  100% { transform: translate(150px, -70px) rotate(-24deg); opacity: 0; }
}
#stage-post .cheer { animation-delay: 1s; }

/* Empty feed 1: waving a note at the empty board */
.note-wave { transform-origin: 0% 100%; animation: note-wave 2.4s ease-in-out infinite; }
@keyframes note-wave { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-3px); } }

/* Empty feed 2: a tumbleweed rolls past */
.tumble { animation: tumble 5s linear infinite; }
@keyframes tumble {
  0% { transform: translate(260px, 0); }
  20% { transform: translate(206px, -12px); }
  40% { transform: translate(152px, 0); }
  60% { transform: translate(98px, -9px); }
  80% { transform: translate(44px, 0); }
  100% { transform: translate(-20px, -6px); }
}
.roll { transform-origin: 50% 50%; animation: roll 1.2s linear infinite; }
@keyframes roll { to { transform: rotate(-360deg); } }

/* Empty feed 3: listening with earmuffs on, the sound waves fade out before they reach the ear */
.listen-wave { fill: none; stroke: var(--primary); stroke-width: 2.4; stroke-linecap: round; opacity: 0; animation: listen-wave 2.4s ease-out infinite; }
@keyframes listen-wave {
  0% { opacity: 0; transform: translateX(10px); }
  30% { opacity: 0.9; }
  100% { opacity: 0; transform: translateX(-12px); }
}

/* Caught up: the feed scrolls to the end and a check appears */
.feed-scroll { animation: feed-scroll 4.4s ease-in-out infinite; }
@keyframes feed-scroll {
  0%, 8% { transform: translateY(0); opacity: 1; }
  50% { transform: translateY(-40px); opacity: 1; }
  58%, 90% { transform: translateY(-40px); opacity: 0.15; }
  100% { transform: translateY(0); opacity: 1; }
}
.caught-up { transform-origin: 50% 50%; animation: caught-up 4.4s ease-out infinite; }
@keyframes caught-up {
  0%, 54% { opacity: 0; transform: scale(0); }
  62% { opacity: 1; transform: scale(1.25); }
  68%, 88% { opacity: 1; transform: scale(1); }
  96%, 100% { opacity: 0; transform: scale(1); }
}
#panel-feed .hop { animation-duration: 4.4s; }

/* Likes: hearts float up */
.heart { fill: var(--primary); opacity: 0; animation: heart 3s ease-out infinite; }
@keyframes heart {
  0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
  18% { opacity: 1; transform: translate(0, -4px) scale(1.15); }
  100% { opacity: 0; transform: translate(var(--dx, 6px), -36px) scale(0.9); }
}


/* Seasonal weather: snow and petals drift down, leaves tumble, the sun turns slowly and butterflies flutter */
.flake { fill: var(--tile); stroke: var(--primary-dimmed); stroke-width: 0.8; }
.petal { fill: var(--primary-dimmed); }
.flake, .petal, .leaf { animation: drift var(--dur, 7s) linear var(--delay, 0s) infinite; opacity: 0; }
.leaf { stroke: rgba(90, 50, 20, 0.35); stroke-width: 0.6; }
@keyframes drift {
  0% { opacity: 0; transform: translate(0, -10px) rotate(0deg); }
  10% { opacity: 0.9; }
  50% { transform: translate(var(--drift, 10px), 85px) rotate(160deg); }
  85% { opacity: 0.9; }
  100% { opacity: 0; transform: translate(0, 180px) rotate(320deg); }
}
.sun-rays { animation: sun 12s linear infinite; transform-origin: 50% 50%; }
@keyframes sun { to { transform: rotate(360deg); } }
.butterfly { animation: flutter 0.5s ease-in-out infinite alternate, butterfly-path 6s ease-in-out infinite; transform-origin: 50% 50%; }
@keyframes flutter { from { scale: 1 1; } to { scale: 0.35 1; } }
@keyframes butterfly-path {
  0%, 100% { translate: 0 0; }
  33% { translate: 10px -8px; }
  66% { translate: -8px -4px; }
}

/* Moro: waving on hover, a jump and a blush on click */
.poke-stage { cursor: pointer; user-select: none; }
.wave-arm { transform-origin: 0% 100%; animation: wave 0.45s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
.poke { transform-origin: 50% 100%; animation: poke 0.9s cubic-bezier(0.3, 0, 0.4, 1); }
@keyframes poke {
  0% { transform: translateY(0) scale(1, 1); }
  15% { transform: translateY(0) scale(1.1, 0.88); }
  40% { transform: translateY(-22px) scale(0.95, 1.06); }
  70% { transform: translateY(0) scale(1.06, 0.92); }
  100% { transform: translateY(0) scale(1, 1); }
}
.m-blush.hot { fill: var(--primary); opacity: 0.55; transform-origin: 50% 50%; animation: hot 0.9s ease-out both; }
@keyframes hot { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1.25); } }

/* New hats: the bunny ear flops, the headlamp beam flickers */
.ear-flop { transform-origin: 30% 100%; animation: ear-flop 2.8s ease-in-out infinite; }
@keyframes ear-flop { 0%, 60%, 100% { transform: rotate(0deg); } 70%, 85% { transform: rotate(28deg); } }
.headlamp-beam { animation: headlamp 3s ease-in-out infinite; }
@keyframes headlamp { 0%, 100% { opacity: 0.5; } 48% { opacity: 0.65; } 52% { opacity: 0.25; } 56% { opacity: 0.6; } }

/* Rain falls from the little cloud hat */
.raindrop { opacity: 0; animation: raindrop 0.9s linear infinite; }
@keyframes raindrop { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(12px); } }

/* Varsler 1, fishing: the water flows, the float bobs, something nibbles but nothing bites */
.water-wave { animation: water-wave 3s linear infinite; }
@keyframes water-wave { to { transform: translateX(-60px); } }
.bobber { animation: bobber 5s ease-in-out infinite; }
@keyframes bobber {
  0%, 50%, 100% { transform: translateY(0); }
  25% { transform: translateY(-1.5px); }
  58% { transform: translateY(5px); }
  62% { transform: translateY(0); }
  66% { transform: translateY(6px); }
  72% { transform: translateY(0); }
}
.fish-ripple { transform-origin: 50% 50%; opacity: 0; animation: fish-ripple 5s ease-out infinite; }
@keyframes fish-ripple { 0%, 56% { opacity: 0; transform: scale(1); } 60% { opacity: 0.8; } 85%, 100% { opacity: 0; transform: scale(2.6); } }
.nibble-mark { font: 700 22px var(--font); fill: var(--primary); opacity: 0; animation: nibble-mark 5s ease-in-out infinite; }
@keyframes nibble-mark { 0%, 56%, 80%, 100% { opacity: 0; } 60%, 74% { opacity: 1; } }
.fisher { transform-origin: 50% 100%; animation: fisher 5s ease-in-out infinite; }
@keyframes fisher { 0%, 54%, 80%, 100% { transform: rotate(0deg); } 60%, 74% { transform: rotate(5deg); } }

.clip-stage svg { overflow: hidden; }

/* Varsler 4, mailbox: the door swings open, a moth flutters out, the door closes again */
.mailbox-door { transform-origin: 0% 100%; animation: mailbox-door 6s ease-in-out infinite; }
@keyframes mailbox-door { 0%, 24%, 88%, 100% { transform: rotate(0deg); } 32%, 80% { transform: rotate(-100deg); } }
.mailbox-flag-down { transform-origin: 0% 0%; }
.moth { opacity: 0; animation: moth 6s ease-in-out infinite; }
@keyframes moth {
  0%, 40% { opacity: 0; transform: translate(0, 0); }
  44% { opacity: 1; transform: translate(-2px, -6px); }
  52% { transform: translate(-14px, -24px); }
  60% { transform: translate(-2px, -40px); }
  68% { transform: translate(-20px, -58px); }
  76% { opacity: 1; transform: translate(-6px, -74px); }
  84%, 100% { opacity: 0; transform: translate(-24px, -92px); }
}
.moth-wings { transform-origin: 50% 50%; animation: moth-wings 0.18s ease-in-out infinite alternate; }
@keyframes moth-wings { from { transform: scaleY(1); } to { transform: scaleY(0.2); } }
.peek-in { transform-origin: 50% 100%; animation: peek-in 6s ease-in-out infinite; }
@keyframes peek-in {
  0%, 26%, 90%, 100% { transform: translateX(0) rotate(0deg); }
  34%, 46% { transform: translateX(6px) rotate(6deg); }
  52%, 82% { transform: translateX(0) rotate(-3deg); }
}

/* Varsler 5, radar: the beam sweeps around and finds nothing */
.radar-sweep { transform-origin: 50% 50%; animation: radar 3s linear infinite; }
@keyframes radar { to { transform: rotate(360deg); } }
.radar-ping { fill: none; stroke: var(--primary-dimmed); stroke-width: 1.4; transform-origin: 50% 50%; animation: radar-ping 3s ease-out infinite; }
@keyframes radar-ping { 0% { opacity: 0.9; transform: scale(1); } 60%, 100% { opacity: 0; transform: scale(16); } }

/* Varsler 6, sweeping: the broom swishes, dust swirls up and the clean floor sparkles */
.broom { transform-origin: 0% 0%; animation: broom 1.1s ease-in-out infinite alternate; }
@keyframes broom { from { transform: rotate(-7deg); } to { transform: rotate(8deg); } }
.dust { fill: var(--primary-dimmed); opacity: 0; transform-origin: 50% 50%; animation: dust 1.6s ease-out infinite; animation-delay: calc(var(--i) * 0.4s); }
@keyframes dust { 0% { opacity: 0.8; transform: translate(0, 0) scale(0.6); } 100% { opacity: 0; transform: translate(14px, -18px) scale(1.8); } }

/* Butikkbesøk: the door sign flips from moon (closed) to sun (open), and the mascot hops when the store opens */
.store-sign { transform-origin: 50% 0%; animation: store-sign 6s ease-in-out infinite; }
@keyframes store-sign { 0%, 40%, 50%, 90%, 100% { transform: scaleX(1) rotate(0deg); } 45%, 95% { transform: scaleX(0) rotate(0deg); } 52%, 92% { transform: scaleX(1) rotate(6deg); } }
.store-sign-closed { animation: store-closed 6s step-end infinite; }
@keyframes store-closed { 0% { opacity: 1; } 45% { opacity: 0; } 95% { opacity: 1; } }
.store-sign-open { opacity: 0; animation: store-open 6s step-end infinite; }
@keyframes store-open { 0% { opacity: 0; } 45% { opacity: 1; } 95% { opacity: 0; } }
.store-hop { transform-origin: 50% 100%; animation: store-hop 6s ease-in-out infinite; }
@keyframes store-hop { 0%, 50%, 66%, 100% { transform: translateY(0) scale(1, 1); } 53% { transform: translateY(0) scale(1.06, 0.93); } 58% { transform: translateY(-14px) scale(0.97, 1.04); } 63% { transform: translateY(0) scale(1.03, 0.97); } }
.store-awning { transform-origin: 50% 0%; animation: store-awning 3s ease-in-out infinite; }
@keyframes store-awning { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.08); } }

/* Butikkbesøk 2: the trolley walk into the shop */
.shopper { animation: shopper 7s ease-in-out infinite; }
@keyframes shopper { 0% { opacity: 0; transform: translateX(-90px); } 6% { opacity: 1; } 46% { transform: translateX(0); } 58% { transform: translateX(0); opacity: 1; } 72% { transform: translateX(34px); opacity: 0; } 100% { opacity: 0; transform: translateX(34px); } }
.wheel { transform-origin: 50% 50%; animation: wheel 0.7s linear infinite; }
@keyframes wheel { to { transform: rotate(360deg); } }
#stage-store-none .store-sign, #stage-store-none .store-sign-closed, #stage-store-none .store-sign-open { animation-duration: 7s; }
.slide-door-left { animation: door-left 7s ease-in-out infinite; }
.slide-door-right { animation: door-right 7s ease-in-out infinite; }
@keyframes door-left { 0%, 48%, 82%, 100% { transform: translateX(0); } 54%, 74% { transform: translateX(-12px); } }
@keyframes door-right { 0%, 48%, 82%, 100% { transform: translateX(0); } 54%, 74% { transform: translateX(12px); } }
.door-sensor { animation: door-sensor 7s step-end infinite; }
@keyframes door-sensor { 0% { fill: var(--primary-dimmed); } 46% { fill: #7bd389; } 80% { fill: var(--primary-dimmed); } }
/* Butikkbesøk 3, scanner: the laser sweeps, the scanner beeps and shows 0, the mascot tilts its head and the last box tips over */
.scan-beam, .scan-line { transform-origin: 0% 50%; animation: scan-sweep 6s ease-in-out infinite; }
@keyframes scan-sweep { 0% { opacity: 0; transform: rotate(-12deg); } 5% { opacity: 1; } 15% { transform: rotate(12deg); } 25% { transform: rotate(-12deg); } 35% { transform: rotate(10deg); opacity: 1; } 40%, 100% { opacity: 0; transform: rotate(0deg); } }
.scan-beep { opacity: 0; animation: scan-beep 6s ease-out infinite; }
@keyframes scan-beep { 0%, 38% { opacity: 0; } 41%, 46% { opacity: 1; } 50%, 100% { opacity: 0; } }
.scan-zero { font: 700 7px var(--font); fill: #2f7a45; opacity: 0; animation: scan-zero 6s step-end infinite; }
@keyframes scan-zero { 0% { opacity: 0; } 40% { opacity: 1; } 92% { opacity: 0; } }
.scan-puzzle { transform-origin: 50% 100%; animation: scan-puzzle 6s ease-in-out infinite; }
@keyframes scan-puzzle { 0%, 46%, 90%, 100% { transform: rotate(0deg); } 52%, 82% { transform: rotate(-7deg); } }
.scan-eyes { animation: scan-eyes 6s ease-in-out infinite; }
@keyframes scan-eyes { 0%, 44%, 90%, 100% { transform: translate(0, 0); } 48%, 84% { transform: translate(1px, 2px); } }
.scan-wonder { font: 700 22px var(--font); fill: var(--primary); opacity: 0; animation: scan-wonder 6s ease-in-out infinite; }
@keyframes scan-wonder { 0%, 50% { opacity: 0; transform: translateY(6px); } 56%, 84% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; transform: translateY(-6px); } }
.scan-box { transform-origin: 100% 100%; animation: scan-box 6s cubic-bezier(0.5, 0, 0.7, 1) infinite; }
@keyframes scan-box { 0%, 70% { transform: rotate(0deg); } 76% { transform: rotate(-12deg); } 82%, 94% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }

/* Butikkbesøk 4, completed: the stamp thumps down, a check appears, the mascot jumps */
.stamp { animation: stamp 6s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
@keyframes stamp { 0%, 14% { opacity: 0; transform: translateY(-30px); } 20% { opacity: 1; transform: translateY(-30px); } 30% { transform: translateY(22px) scale(1.05, 0.9); } 34% { transform: translateY(20px) scale(1, 1); } 46% { opacity: 1; transform: translateY(-34px); } 52%, 100% { opacity: 0; transform: translateY(-34px); } }
.stamp-thump { opacity: 0; animation: stamp-thump 6s ease-out infinite; }
@keyframes stamp-thump { 0%, 29% { opacity: 0; } 31%, 38% { opacity: 1; } 44%, 100% { opacity: 0; } }
.stamp-check { stroke-dasharray: 40; stroke-dashoffset: 40; animation: stamp-check 6s ease-out infinite; }
@keyframes stamp-check { 0%, 30% { stroke-dashoffset: 40; opacity: 1; } 32%, 90% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
.stamp-hop { transform-origin: 50% 100%; animation: stamp-hop 6s ease-in-out infinite; }
@keyframes stamp-hop { 0%, 29%, 50%, 76%, 100% { transform: translateY(0) scale(1, 1); } 31% { transform: translateY(0) scale(1.04, 0.95); } 56% { transform: translateY(0) scale(1.07, 0.92); } 63% { transform: translateY(-18px) scale(0.96, 1.05); } 70% { transform: translateY(0) scale(1.04, 0.96); } }

/* Butikkbesøk 5, scheduled: a day is circled and a little shop pops onto it */
.plan-circle { stroke-dasharray: 70; stroke-dashoffset: 70; animation: plan-circle 5s ease-in-out infinite; }
@keyframes plan-circle { 0%, 20% { stroke-dashoffset: 70; opacity: 1; } 40%, 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
.plan-shop { transform-origin: 50% 50%; opacity: 0; animation: plan-shop 5s cubic-bezier(0.2, 0.9, 0.3, 1.4) infinite; }
@keyframes plan-shop { 0%, 40% { opacity: 0; transform: scale(0); } 48%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }

/* Butikkbesøk 3, empty box: the flaps pop open, dust and a feather come out, the mascot leans in to look */
.box-flap-left { transform-origin: 0% 100%; animation: box-flap-left 6s ease-in-out infinite; }
.box-flap-right { transform-origin: 100% 100%; animation: box-flap-right 6s ease-in-out infinite; }
@keyframes box-flap-left { 0%, 18%, 88%, 100% { transform: rotate(0deg); } 26%, 80% { transform: rotate(-150deg); } }
@keyframes box-flap-right { 0%, 18%, 88%, 100% { transform: rotate(0deg); } 26%, 80% { transform: rotate(150deg); } }
.box-dust { transform-origin: 50% 100%; opacity: 0; animation: box-dust 6s ease-out infinite; }
@keyframes box-dust { 0%, 22% { opacity: 0; transform: scale(0.3) translateY(8px); } 30% { opacity: 0.9; } 46%, 100% { opacity: 0; transform: scale(1.6) translateY(-16px); } }
.box-feather { opacity: 0; animation: box-feather 6s ease-in-out infinite; }
@keyframes box-feather { 0%, 24% { opacity: 0; transform: translate(0, 6px) rotate(0deg); } 32% { opacity: 1; transform: translate(-6px, -26px) rotate(-20deg); } 44% { transform: translate(8px, -34px) rotate(15deg); } 56% { transform: translate(-4px, -22px) rotate(-10deg); } 66% { opacity: 1; transform: translate(6px, -8px) rotate(10deg); } 74%, 100% { opacity: 0; transform: translate(0, 0) rotate(0deg); } }
.box-lean { transform-origin: 50% 100%; animation: box-lean 6s ease-in-out infinite; }
@keyframes box-lean { 0%, 14%, 88%, 100% { transform: translateX(0) rotate(0deg); } 20%, 26% { transform: translateX(4px) rotate(4deg); } 50%, 78% { transform: translateX(4px) rotate(8deg); } }
.box-wonder { animation-delay: 0.3s; }

/* Butikkbesøk 2: the empty shelf wobbles its last item */
.shelf-item { transform-origin: 50% 100%; animation: shelf-item 3.4s ease-in-out infinite; }
@keyframes shelf-item { 0%, 70%, 100% { transform: rotate(0deg); } 76% { transform: rotate(-9deg); } 82% { transform: rotate(6deg); } 88% { transform: rotate(-3deg); } }

/* Week plan alarm clock hat: the minute hand ticks round, the clock rings every few seconds */
.clock-hand { transform-origin: 50% 50%; animation: clock-hand 6s steps(12) infinite; }
@keyframes clock-hand { to { transform: rotate(360deg); } }
.clock-ring { transform-origin: 50% 100%; animation: clock-ring 4s ease-in-out infinite; }
@keyframes clock-ring { 0%, 70%, 100% { transform: rotate(0deg); } 73%, 79%, 85% { transform: rotate(-8deg); } 76%, 82%, 88% { transform: rotate(8deg); } }
.clock-waves { opacity: 0; animation: clock-waves 4s ease-out infinite; }
@keyframes clock-waves { 0%, 70%, 92%, 100% { opacity: 0; } 74%, 88% { opacity: 1; } }

/* Week plan hat candidates: the tear-off sheet flips away and comes back */
.tearoff-day { font: 700 11px var(--font); fill: var(--ink); text-anchor: middle; }
.tearoff-check { stroke-dasharray: 12; stroke-dashoffset: 12; animation: tearoff-check 5s ease-out infinite; }
@keyframes tearoff-check { 0%, 18% { stroke-dashoffset: 12; } 30%, 100% { stroke-dashoffset: 0; } }
.tearoff-page { transform-origin: 0% 0%; animation: tearoff 5s ease-in infinite; }
@keyframes tearoff {
  0%, 38% { opacity: 1; transform: translate(0, 0) rotate(0deg) skewX(0deg); }
  44% { opacity: 1; transform: translate(1px, -2px) rotate(-6deg) skewX(-6deg); }
  52% { transform: translate(10px, -12px) rotate(14deg) skewX(4deg); }
  62% { opacity: 0.9; transform: translate(22px, -6px) rotate(32deg) skewX(-4deg); }
  72% { opacity: 0; transform: translate(34px, -18px) rotate(50deg) skewX(0deg); }
  90% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
  100% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
}

/* Week crown: the seven gems light up one day at a time; stopwatch: the hand races round */
.crown-gem { fill: var(--primary-darker); animation: crown-gem 4.2s ease-in-out infinite; animation-delay: calc(var(--i) * 0.4s); }
@keyframes crown-gem { 0%, 100% { fill: var(--primary-darker); } 12%, 60% { fill: #f4c542; } }
.stopwatch-hand { transform-origin: 50% 50%; animation: clock-hand 2s linear infinite; }

/* Week completed: calendar sheets flutter down, rocking side to side as they fall */
.calendar-sheet-fall { opacity: 0; transform-origin: 50% 50%; animation: sheet-fall var(--dur, 3s) ease-in var(--delay, 0s) both; }
@keyframes sheet-fall {
  0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
  8% { opacity: 1; }
  35% { transform: translate(calc(var(--dx) * 0.4), 140px) rotate(calc(var(--rot) * 0.35)); }
  65% { transform: translate(calc(var(--dx) * -0.2), 290px) rotate(calc(var(--rot) * 0.7)); }
  85% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), 470px) rotate(var(--rot)); }
}
.sheet-date { font: 700 7.5px var(--font); fill: var(--ink); text-anchor: middle; }
.calendar-sheet-turn { transform-origin: 50% 50%; animation: sheet-turn 0.9s ease-in-out infinite alternate; }
@keyframes sheet-turn { from { transform: scaleX(1); } to { transform: scaleX(0.35); } }

/* Varsler 2, hammock: the hammock sways and the mascot whistles */
.hammock-swing { transform-origin: 50% 0%; animation: swing 4s ease-in-out infinite; }

/* Varsler 3, juggling: three notifications circle, pop one by one, then the mascot takes a bow */
.juggle-orbit { animation: juggle 1.2s linear infinite; }
@keyframes juggle {
  0%, 100% { transform: translate(40px, 0); }
  12.5% { transform: translate(28px, -21px); }
  25% { transform: translate(0, -30px); }
  37.5% { transform: translate(-28px, -21px); }
  50% { transform: translate(-40px, 0); }
  62.5% { transform: translate(-28px, 21px); }
  75% { transform: translate(0, 30px); }
  87.5% { transform: translate(28px, 21px); }
}
.juggle-life { transform-origin: 50% 50%; animation: juggle-life 6s ease-out infinite; }
@keyframes juggle-life {
  0%, 56% { opacity: 1; transform: scale(1); }
  62% { opacity: 0; transform: scale(1.9); }
  95% { opacity: 0; transform: scale(0.2); }
  100% { opacity: 1; transform: scale(1); }
}
.juggler { transform-origin: 50% 100%; animation: juggler-bow 6s ease-in-out infinite; }
@keyframes juggler-bow { 0%, 74%, 100% { transform: scale(1, 1); } 80%, 90% { transform: scale(1.05, 0.84); } }

/* Lastere: looping loaders, one per module */
.loader-stage { min-height: 248px; justify-content: center; }
.loading-text { font-size: 14px; font-weight: 500; color: var(--muted); }
.dots i { font-style: normal; animation: dot 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: 0.2s; }
.dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
.loader-fast .mini-flip { animation-duration: 0.6s; }
.walk-bob { animation: walk-bob 0.5s ease-in-out infinite; }
@keyframes walk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.walk-leg { transform-origin: 50% 0%; animation: walk-leg 1s ease-in-out infinite; }
.walk-leg--back { animation-delay: -0.5s; }
@keyframes walk-leg { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }
.walk-arm { transform-origin: 0% 0%; animation: walk-leg 1s ease-in-out infinite reverse; }
.ground-move { animation: ground 1s linear infinite; }
@keyframes ground { from { transform: translateX(0); } to { transform: translateX(-40px); } }
.day-loop rect { fill: var(--bg); stroke: var(--primary-dimmed); stroke-width: 2; animation: day-loop 2.5s ease-in-out infinite; animation-delay: calc(var(--i) * 0.5s); }
.day-loop text { font: 600 11px var(--font); fill: var(--primary-darker); text-anchor: middle; pointer-events: none; }
@keyframes day-loop {
  0%, 30%, 100% { fill: var(--bg); stroke: var(--primary-dimmed); }
  10%, 20% { fill: var(--primary-dimmed); stroke: var(--primary); }
}
.typing-dot { fill: var(--primary); animation: typing 1.2s ease-in-out infinite; animation-delay: calc(var(--i) * 0.18s); }
@keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-6px); opacity: 1; } }
.mini-loaders { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.mini-loader { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.mini-loader svg, .mini-loader-btn svg { width: 22px; height: 33px; max-width: none; overflow: visible; }
.mini-loader-btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; }

/* Moro: escalating clicks; pages fly out, the hat flies off, the mascot gets dizzy and finally falls over */
.flying-page { transform-origin: 50% 50%; opacity: 0; animation: page-fly 1.8s cubic-bezier(0.2, 0.7, 0.4, 1) both; }
@keyframes page-fly {
  0% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(0.4); }
  12% { opacity: 1; }
  35% { transform: translate(calc(var(--dx) * 0.6), -38px) rotate(calc(var(--rot) * 0.5)) scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), 40px) rotate(var(--rot)) scale(0.9); }
}
.page-flutter { transform-origin: 50% 50%; animation: page-flutter 0.45s ease-in-out infinite alternate; }
@keyframes page-flutter { from { transform: scaleX(1) skewY(0deg); } to { transform: scaleX(0.35) skewY(8deg); } }
.dizzy-stars { display: none; }
.is-dizzy .dizzy-stars { display: inline; }
.orbit-star { fill: var(--primary); animation: orbit 1.2s linear infinite; }
@keyframes orbit {
  0% { transform: translate(26px, 0); }
  12.5% { transform: translate(18.4px, 5.7px); }
  25% { transform: translate(0, 8px); }
  37.5% { transform: translate(-18.4px, 5.7px); }
  50% { transform: translate(-26px, 0); }
  62.5% { transform: translate(-18.4px, -5.7px); }
  75% { transform: translate(0, -8px); }
  87.5% { transform: translate(18.4px, -5.7px); }
  100% { transform: translate(26px, 0); }
}
.is-dizzy .combo-fall { transform-origin: 50% 100%; animation: wobble 0.9s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
.spin-eyes path { transform-origin: 50% 50%; animation: spin-eye 1s linear infinite; }
@keyframes spin-eye { to { transform: rotate(360deg); } }
.combo-fall.fall-over { transform-origin: 85% 100%; animation: fall-over 3.2s ease-in-out both; }
@keyframes fall-over {
  0% { transform: rotate(0deg); }
  18% { transform: rotate(84deg); }
  22% { transform: rotate(78deg); }
  26%, 62% { transform: rotate(82deg); }
  80% { transform: rotate(-6deg); }
  90% { transform: rotate(3deg); }
  100% { transform: rotate(0deg); }
}

/* Moro: hiding behind a component and peeking out; the svg clips the mascot while it is hidden */
.peek-stage svg { overflow: hidden; }
.peek-stage { cursor: pointer; }
.peek-side { transform-origin: 50% 100%; animation: peek-side 6s ease-in-out infinite; }
@keyframes peek-side {
  0%, 18%, 88%, 100% { transform: translateX(-46px) rotate(0deg); }
  30%, 46% { transform: translateX(6px) rotate(9deg); }
  52% { transform: translateX(-6px) rotate(2deg); }
  60%, 76% { transform: translateX(8px) rotate(11deg); }
}
.peek-up { animation: peek-up 6s ease-in-out infinite; }
@keyframes peek-up {
  0%, 16%, 90%, 100% { transform: translateY(74px); }
  28%, 46% { transform: translateY(-14px); }
  52% { transform: translateY(6px); }
  60%, 80% { transform: translateY(-16px); }
}
.peek-stage.shy .peek-side { animation: duck-side 0.3s ease-in forwards; }
.peek-stage.shy .peek-up { animation: duck-up 0.3s ease-in forwards; }
@keyframes duck-side { from { transform: translateX(6px) rotate(9deg); } to { transform: translateX(-46px) rotate(0deg); } }
@keyframes duck-up { from { transform: translateY(-14px); } to { transform: translateY(74px); } }

/* Combined page: sticky module tabs */
.tabs {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  margin-block: -10px;
  background: var(--bg);
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.tab .count {
  font-size: 12px;
  color: var(--muted);
}
.tab[aria-selected="true"] {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.tab[aria-selected="true"] .count { color: rgba(255, 255, 255, 0.8); }
.tab:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.panel { display: flex; flex-direction: column; gap: 22px; }
.panel[hidden] { display: none !important; }
.panel-head h2 { margin: 0; font-size: 22px; font-weight: 500; }
.panel-head .intro { margin-top: 4px; }
.controls { display: flex; flex-direction: column; gap: 10px; }

@media (prefers-reduced-motion: reduce) {
  .page * { animation: none !important; }
  .sparkles path,
  .zz,
  .listen-wave,
  .wonder,
  .flake,
  .petal,
  .leaf { opacity: 1; }
}

.foot {
  font-size: 13px;
  color: var(--muted);
  max-width: 72ch;
  margin: 0;
}

h3.section-h { margin: 10px 0 0; font-size: 18px; font-weight: 500; }

/* Solo mode (?scene=<stage id>): only that scene, transparent, filling the frame, for embedding over a screenshot */
html.solo, html.solo body { background: transparent !important; color-scheme: normal !important; height: 100%; overflow: hidden; }
html.solo main.page { display: none; }
html.solo #nl-badge-frame { display: none !important; }
html.solo .solo-scene { position: fixed; inset: 0; min-height: 0 !important; border-radius: 0; background: transparent; padding: 0; }
html.solo .solo-scene .mock-list { display: none; }
html.solo .solo-scene .scrim { background: rgba(44, 42, 43, 0.32); animation: solo-dim 0.3s ease-out both; }
@keyframes solo-dim { from { background: rgba(44, 42, 43, 0); } }
html.solo .solo-scene .dialog { width: min(36vw, 440px); padding: 2vw 2.4vw 2.4vw; }
html.solo .solo-scene .dialog svg { max-width: none; }
html.solo .solo-scene.stage { position: fixed; inset: 0; border-radius: 0; padding: 0; justify-content: center; background: transparent; }
html.solo .solo-scene.stage svg { width: 100%; height: 100%; max-width: none; }
html.solo .solo-scene.stage > :not(svg) { display: none; }

/* The week plan's day-completed dialog as it looks in the app: the dialog pops up, today's day fills with a ring,
   the mascot cheers with the tear-off calendar on its head, and confetti in the theme colors falls in front of it all */
.wp-day { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: rgba(44, 42, 43, 0.32); animation: wp-dim 0.3s ease-out both; }
@keyframes wp-dim { from { background: rgba(44, 42, 43, 0); } }
.wp-day[hidden] { display: none; }
.wp-dialog {
  width: 360px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 16px 20px 24px; text-align: center; border-radius: 12px; background: #fff; color: #2c2a2b;
  box-shadow: 0 10px 30px rgba(44, 42, 43, 0.22); font-family: var(--font);
  transform: scale(var(--wp-scale, 1)); animation: wp-pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
}
@keyframes wp-pop { from { transform: scale(calc(var(--wp-scale, 1) * 0.8)); opacity: 0; } to { transform: scale(var(--wp-scale, 1)); opacity: 1; } }
.wp-days { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
.wp-days span {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-size: 12px; font-weight: 600;
  color: var(--primary-darker); background: #fff; border: 2px solid var(--primary-dimmed); box-sizing: border-box;
}
.wp-days .wp-weekend { border-style: dashed; }
.wp-days .wp-done { color: #fff; background: var(--primary); border-color: var(--primary); }
.wp-days .wp-today { animation: wp-fill 0.45s ease-out 0.4s both, wp-ring 1.2s ease-out 0.85s 2; }
@keyframes wp-fill { 60% { transform: scale(1.22); } 100% { color: #fff; background: var(--primary); border-color: var(--primary); transform: scale(1); } }
@keyframes wp-ring { from { box-shadow: 0 0 0 0 var(--primary-dimmed); } to { box-shadow: 0 0 0 10px transparent; } }
.wp-days b { margin: 0 -4px; font-size: 26px; font-weight: 300; line-height: 1; color: var(--primary-dimmed); }
.wp-dialog svg { width: 240px; height: auto; overflow: visible; }
.wp-dialog .cheer { animation-delay: 0.85s; }
.wp-title { font-size: 20px; font-weight: 700; }
.wp-text { font-size: 14px; color: #6e686b; }
.wp-btn { margin-top: 12px; padding: 8px 24px; border-radius: 4px; background: var(--primary); color: #fff; font-size: 14px; font-weight: 500; }
.wp-confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.wp-piece {
  position: absolute; top: -20px; width: calc(10px * var(--wp-scale, 1)); height: calc(14px * var(--wp-scale, 1)); border-radius: 2px; opacity: 0;
  animation: wp-fall var(--duration) linear var(--delay) both;
}
@keyframes wp-fall {
  0% { opacity: 0; transform: translate3d(0, 0, 0) rotate(0deg); }
  8%, 80% { opacity: 1; }
  100% { opacity: 0; transform: translate3d(var(--drift), 100vh, 0) rotate(var(--spin)); }
}

html, body { margin: 0; height: 100%; overflow: hidden; background: transparent !important; color-scheme: normal !important; }
#nl-badge-frame { display: none !important; }
</style>
</head>
<body>
<div class="wp-day" id="stage-weekplan-day">
  <div class="wp-dialog">
    <div class="wp-days" aria-hidden="true">
      <span class="wp-done">M</span><span class="wp-done">T</span><span class="wp-today">O</span><span>T</span><span>F</span><b>(</b><span class="wp-weekend">L</span><span class="wp-weekend">S</span><b>)</b>
    </div>
    <svg viewBox="0 0 240 170" aria-hidden="true">
      <ellipse class="floor" cx="120" cy="158" rx="36" ry="5"></ellipse>
      <g transform="translate(120 156)"><g class="cheer" data-mascot="cheer" data-hat="tearoff">
    <path class="m-limb" d="M-10 -12 L-10 -2 M10 -12 L10 -2"></path>
       <ellipse class="m-shoe" cx="-12" cy="0" rx="7" ry="3.4"></ellipse>
       <ellipse class="m-shoe" cx="12" cy="0" rx="7" ry="3.4"></ellipse>
    
    <rect class="m-book" x="-28" y="-82" width="56" height="72" rx="9"></rect>
    <rect class="m-spine" x="-28" y="-82" width="13" height="72" rx="6"></rect>
    <ellipse class="m-blush " cx="-12" cy="-47" rx="4.5" ry="2.6"></ellipse>
    <ellipse class="m-blush " cx="18" cy="-47" rx="4.5" ry="2.6"></ellipse>
    <path class="m-line" d="M-8 -55 Q-4 -60 0 -55 M6 -55 Q10 -60 14 -55"></path>
    <path class="m-ink" d="M-2 -47 Q3 -37 8 -47 Z"></path>
    <g class="m-cap-group" transform="rotate(0 3 -86)">
    <rect x="-13" y="-111" width="32" height="30" rx="3.5" fill="var(--primary-dimmed)" stroke="var(--primary-darker)" stroke-width="1.6"></rect>
    <rect x="-12" y="-104" width="30" height="22" rx="2" fill="var(--tile)"></rect>
    <text class="tearoff-day" x="1" y="-86.5">13</text>
    <g class="tearoff-page">
      <path d="M-12 -104 H18 V-84.5 Q18 -82 15.5 -82 H-9.5 Q-12 -82 -12 -84.5 Z" fill="var(--tile)" stroke="var(--line)" stroke-width="0.8"></path>
      <path d="M-12 -104 L-10 -102.6 L-8 -104 L-6 -102.6 L-4 -104 L-2 -102.6 L0 -104 L2 -102.6 L4 -104 L6 -102.6 L8 -104 L10 -102.6 L12 -104 L14 -102.6 L16 -104 L18 -102.6" fill="none" stroke="var(--line)" stroke-width="0.8"></path>
      <text class="tearoff-day" x="1" y="-86.5">12</text>
      <path class="tearoff-check" d="M8.5 -99.5 L11 -97 L15.5 -101.5" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
    <path d="M-13 -107 Q-13 -111 -9.5 -111 H15.5 Q19 -111 19 -107 V-104 H-13 Z" fill="var(--primary)"></path>
    <rect x="-9.2" y="-115" width="2.4" height="6" rx="1.2" fill="var(--primary-darker)"></rect><rect x="-3.2" y="-115" width="2.4" height="6" rx="1.2" fill="var(--primary-darker)"></rect><rect x="2.8" y="-115" width="2.4" height="6" rx="1.2" fill="var(--primary-darker)"></rect><rect x="8.8" y="-115" width="2.4" height="6" rx="1.2" fill="var(--primary-darker)"></rect><rect x="14.8" y="-115" width="2.4" height="6" rx="1.2" fill="var(--primary-darker)"></rect></g>
    <path class="m-limb" d="M-28 -46 Q-44 -64 -38 -86"></path>
    <path class="m-limb " d="M28 -46 Q44 -64 40 -86"></path>
    </g></g>
    </svg>
    <span class="wp-title">Dagen er i boks</span>
    <span class="wp-text">Du har fullført alle dagens oppgaver.</span>
    <span class="wp-btn">Fortsett</span>
  </div>
  <div class="wp-confetti" aria-hidden="true"></div>
</div>
<script>
const scene = document.getElementById('stage-weekplan-day');
const fit = () => document.documentElement.style.setProperty('--wp-scale', String((innerWidth * 0.245) / 360));
fit();
addEventListener('resize', fit);
const colors = ['var(--primary)', 'var(--primary-darker)', 'var(--primary-dimmed)'];
const count = 55;
const slots = Array.from({ length: count }, (_, i) => i).sort(() => Math.random() - 0.5);
const layer = scene.querySelector('.wp-confetti');
for (let i = 0; i < count; i++) {
  const piece = document.createElement('span');
  piece.className = 'wp-piece';
  piece.style.left = ((i + Math.random()) / count) * 100 + '%';
  piece.style.background = colors[Math.floor(Math.random() * colors.length)];
  piece.style.setProperty('--delay', (0.1 + ((slots[i] + Math.random()) / count) * 1.4).toFixed(2) + 's');
  piece.style.setProperty('--duration', (1.7 + Math.random() * 0.9).toFixed(2) + 's');
  piece.style.setProperty('--drift', Math.round(Math.random() * 80 - 40) + 'px');
  piece.style.setProperty('--spin', Math.round(300 + Math.random() * 500) + 'deg');
  layer.append(piece);
}
</script>
</body>
</html>
